name: Build and Push Docker Image on Release

on:  
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "GitHub release/tag: $GITHUB_REF_NAME"
          docker build . \
            --file Dockerfile_prod \
            --tag ghcr.io/${REPO_LOWER}/npdb:${GITHUB_REF_NAME}
          docker push ghcr.io/${REPO_LOWER}/npdb:${GITHUB_REF_NAME}
